plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'me.artic'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    compileOnly('org.projectlombok:lombok:1.18.48')
    annotationProcessor('org.projectlombok:lombok:1.18.48')
    implementation('io.github.revxrsal:lamp.common:4.0.0-rc.18')
    implementation('io.github.revxrsal:lamp.bukkit:4.0.0-rc.18')
}

tasks {
    runServer {
        // Configure the Minecraft version for the run-paper task.
        minecraftVersion("26.2")
    }
}

tasks.assemble {
    dependsOn(tasks.shadowJar)
}

tasks.shadowJar {
    archiveClassifier.set("")
    relocate "revxrsal", "me.artic.reassembly.libs.revxrsal"
    minimize()
}

def targetJavaVersion = 25

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

compileJava {
    // Preserve parameter names in the bytecode (required by Lamp)
    options.compilerArgs += ["-parameters"]
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
